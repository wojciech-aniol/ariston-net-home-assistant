version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "ariston-net"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "ariston-net"
    schedule:
      interval: "monthly"
    ignore:
      # bump-library.yml bumps it in manifest.json too.
      - dependency-name: "ariston-net-api"
