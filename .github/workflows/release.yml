---
name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload the zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd custom_components/ariston_net && zip -r "$RUNNER_TEMP/ariston_net.zip" .)
          gh release upload "$TAG" "$RUNNER_TEMP/ariston_net.zip" --clobber
