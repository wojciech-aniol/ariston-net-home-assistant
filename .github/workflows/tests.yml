name: Tests

on:
  push:
    # auto-release.yml runs these tests for ariston-net.
    branches-ignore: [ariston-net]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test, the caller's commit by default.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check format
        run: ruff format --check .

  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q --cov
