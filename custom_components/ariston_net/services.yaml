create_vacation:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ariston_net
    end_date:
      selector:
        date:
set_item_by_id:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ariston_net
    item_id:
      required: true
      selector:
        select:
          options:
            - "AutomaticThermoregulation"
            - "DhwMode"
            - "DhwTemp"
            - "PlantMode"
            - "AntilegionellaOnOff"
            - "AntilegionellaTemp"
            - "AntilegionellaFreq"
            - "ZoneComfortTemp"
            - "ZoneEconomyTemp"
            - "ZoneMode"
            - "ZoneDeroga"
            - "VirtTempOffsetHeat"
    zone:
      required: true
      selector:
        number:
          min: 0
          max: 100
    value:
      required: true
      example: "1"
      selector:
        text:
